*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:auto}

/* crop marks at the page corners */
.crop{position:fixed;width:22px;height:22px;z-index:20;pointer-events:none;border:0 solid var(--ink)}
.crop--tl{top:14px;left:14px;border-top-width:1px;border-left-width:1px}
.crop--tr{top:14px;right:14px;border-top-width:1px;border-right-width:1px}
.crop--bl{bottom:14px;left:14px;border-bottom-width:1px;border-left-width:1px}
.crop--br{bottom:14px;right:14px;border-bottom-width:1px;border-right-width:1px}

.bar{
  position:sticky;top:0;z-index:15;background:var(--paper);
  display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
  padding:26px var(--pad) 22px;
}
.bar__logo{height:clamp(28px,3vw,40px);flex:0 0 auto}
.bar__logo img{height:100%;width:auto}
.menu{display:grid;grid-template-columns:repeat(4,auto);gap:6px clamp(24px,5vw,90px);font-size:11px;letter-spacing:.14em}
.menu a{display:flex;align-items:center;gap:9px;white-space:nowrap}
.menu a::before{content:"";width:7px;height:7px;background:var(--ink);flex:0 0 auto}
.menu a:hover{color:var(--red)}
.menu a:hover::before{background:var(--red)}
.menu a.is-here::before{background:var(--red)}
@media(max-width:900px){
  .bar{flex-direction:column;align-items:flex-start}
  .menu{grid-template-columns:repeat(2,auto);gap:8px 40px}
}

.head{padding:clamp(34px,7vw,96px) var(--pad) clamp(26px,4vw,54px);display:flex;
  justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.head h1{font-weight:300;font-size:clamp(30px,6vw,74px);line-height:1;letter-spacing:-.005em}
.head .meta{font-size:10px;letter-spacing:.2em;color:var(--ink-55)}

.grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  column-gap:clamp(20px,4.5vw,90px);row-gap:clamp(60px,11vw,190px);
  padding:0 var(--pad) clamp(80px,12vw,190px);
}
.g__item{position:relative;cursor:pointer;align-self:start;background:#FFFFFF}
.g__item img{aspect-ratio:16/10;object-fit:cover;transition:opacity .4s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.g__item:hover img{opacity:.82;transform:translateY(-4px)}
.g__item figcaption{margin-top:11px;font-size:9px;letter-spacing:.18em;color:var(--ink-55)}
.g__item:nth-child(4n+2){margin-top:clamp(20px,4vw,70px)}
.g__item:nth-child(4n+3){margin-top:clamp(10px,2vw,34px)}
.g__item:nth-child(4n+4){margin-top:clamp(30px,6vw,104px)}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr);row-gap:clamp(36px,9vw,80px)}
  .g__item[class]{margin-top:0}
}

.foot{border-top:1px solid var(--rule);padding:26px var(--pad) 40px;display:flex;
  justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:9.5px;letter-spacing:.18em;color:var(--ink-55)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.985);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
.lb.is-open{opacity:1;visibility:visible}
.lb__fig{display:flex;flex-direction:column;align-items:center;max-width:min(92vw,1500px)}
.lb__fig img{max-width:min(92vw,1500px);max-height:78vh;width:auto;height:auto;object-fit:contain;
  box-shadow:0 30px 80px rgba(0,0,0,.16)}
.lb__cap{margin-top:16px;font-size:9.5px;letter-spacing:.2em;color:var(--ink-55)}
.lb button{background:none;border:0;cursor:pointer;color:var(--ink);font-family:var(--mono);
  text-transform:lowercase;position:absolute}
.lb button:hover{color:var(--red)}
.lb__x{top:var(--pad);right:var(--pad);font-size:11px;letter-spacing:.2em}
.lb__nav{top:50%;transform:translateY(-50%);font-size:24px;padding:20px}
.lb__prev{left:6px}.lb__next{right:6px}
.lb__count{position:absolute;top:var(--pad);left:var(--pad);font-size:9.5px;letter-spacing:.2em;color:var(--ink-55)}

  <button class="lb__nav lb__prev" type="button" id="lbPrev" aria-label="Previous">‹</button>
  <figure class="lb__fig">
    <img id="lbImg" src="" alt="">
    <figcaption class="lb__cap" id="lbCap"></figcaption>
  </figure>
  <button class="lb__nav lb__next" type="button" id="lbNext" aria-label="Next">›</button>
</div>

<script>
(function(){
  const figs = [...document.querySelectorAll('.g__item')];
  const lb = document.getElementById('lb');
  const img = document.getElementById('lbImg');
  const cap = document.getElementById('lbCap');
  const cnt = document.getElementById('lbCount');
  let i = 0;
  function show(n){
    i = (n + figs.length) % figs.length;
    const f = figs[i];
    img.src = f.querySelector('img').getAttribute('src');
    img.alt = f.querySelector('img').alt || '';
    cap.textContent = f.querySelector('figcaption').textContent;
    cnt.textContent = String(i+1).padStart(2,'0') + ' / ' + String(figs.length).padStart(2,'0');
  }
  function open(n){ show(n); lb.classList.add('is-open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('is-open'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
  figs.forEach((f,n)=>{
    f.addEventListener('click', ()=>open(n));
    f.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(n); } });
  });
  document.getElementById('lbX').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', e=>{ e.stopPropagation(); show(i-1); });
  document.getElementById('lbNext').addEventListener('click', e=>{ e.stopPropagation(); show(i+1); });
  lb.addEventListener('click', e=>{ if(e.target === lb) close(); });
  document.addEventListener('keydown', e=>{
    if(!lb.classList.contains('is-open')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowRight') show(i+1);
    if(e.key==='ArrowLeft') show(i-1);
  });
})();
</script>
